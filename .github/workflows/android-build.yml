name: Android Build

# No gradle-wrapper.jar is committed to this repo on purpose (see README - kept the repo
# binary-free). gradle/actions/setup-gradle installs the Gradle distribution itself when it
# doesn't find a wrapper, so `gradle` (not `./gradlew`) is what every step below calls.
#
# OPTIONAL RELEASE SIGNING: if the four BYTETRACK_* secrets below are set on the repo
# (Settings -> Secrets and variables -> Actions), the release APK is signed with them. If they
# aren't set, the release build falls back to an unsigned APK instead of failing the workflow.
#   - BYTETRACK_KEYSTORE_BASE64   base64 of your .jks/.keystore file (e.g. `base64 -i my.jks`)
#   - BYTETRACK_KEYSTORE_PASSWORD
#   - BYTETRACK_KEY_ALIAS
#   - BYTETRACK_KEY_PASSWORD
#
# `secrets` is only valid in a few specific places in a workflow file: jobs.<job_id>.env,
# jobs.<job_id>.if, steps.env, and steps.if - NOT in top-level (workflow-level) `env:`, not in
# `on:`, and not in a job's `if:` combined with contexts that run before the job env exists
# (e.g. `runs-on`, `strategy`). The "Unrecognized named-value: 'secrets'" error means it was
# referenced somewhere outside that list. Everything below only touches secrets inside a
# job-level `env:` (line ~48) and step-level `env:`/`if:` blocks, which are the supported spots.

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write # needed to create a GitHub Release on tag pushes

jobs:
  build:
    runs-on: ubuntu-latest

    # Job-level env is one of the places `secrets` IS allowed. Computing the boolean once here,
    # instead of writing `secrets.BYTETRACK_KEYSTORE_BASE64 != ''` inline in every step's `if:`,
    # is what avoids the error - HAS_SIGNING_SECRETS is a plain env string every later step can
    # safely reference via the `env` context.
    env:
      HAS_SIGNING_SECRETS: ${{ secrets.BYTETRACK_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Decode signing keystore
        if: env.HAS_SIGNING_SECRETS == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.BYTETRACK_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bytetrack-release.jks"

      - name: Build signed release APK
        if: env.HAS_SIGNING_SECRETS == 'true'
        env:
          BYTETRACK_KEYSTORE_PASSWORD: ${{ secrets.BYTETRACK_KEYSTORE_PASSWORD }}
          BYTETRACK_KEY_ALIAS: ${{ secrets.BYTETRACK_KEY_ALIAS }}
          BYTETRACK_KEY_PASSWORD: ${{ secrets.BYTETRACK_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/bytetrack-release.jks" \
            -Pandroid.injected.signing.store.password="$BYTETRACK_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$BYTETRACK_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$BYTETRACK_KEY_PASSWORD"

      - name: Build unsigned release APK (no signing secrets configured)
        if: env.HAS_SIGNING_SECRETS == 'false'
        run: gradle :app:assembleRelease --no-daemon

      - name: Locate build outputs
        id: outputs
        run: |
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "debug_apk=$DEBUG_APK" >> "$GITHUB_OUTPUT"
          echo "release_apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: byte-track-debug
          path: ${{ steps.outputs.outputs.debug_apk }}
          if-no-files-found: error

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: byte-track-release
          path: ${{ steps.outputs.outputs.release_apk }}
          if-no-files-found: error

      # Tagging a commit vX.Y.Z (e.g. v0.2.0) additionally cuts a GitHub Release with both
      # APKs attached, on top of the always-uploaded workflow artifacts above.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.outputs.outputs.debug_apk }}
            ${{ steps.outputs.outputs.release_apk }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
