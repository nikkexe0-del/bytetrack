name: Android Build

# No gradle-wrapper.jar is committed to this repo on purpose (see README - kept the repo
# binary-free). gradle/actions/setup-gradle installs the Gradle distribution itself when it
# doesn't find a wrapper, so `gradle` (not `./gradlew`) is what every step below calls.

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write # needed to create a GitHub Release on tag pushes

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Locate build outputs
        id: outputs
        run: |
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "debug_apk=$DEBUG_APK" >> "$GITHUB_OUTPUT"
          echo "release_apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: byte-track-debug
          path: ${{ steps.outputs.outputs.debug_apk }}
          if-no-files-found: error

      - name: Upload unsigned release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: byte-track-release-unsigned
          path: ${{ steps.outputs.outputs.release_apk }}
          if-no-files-found: error

      # Tagging a commit vX.Y.Z (e.g. v0.2.0) additionally cuts a GitHub Release with both
      # APKs attached, on top of the always-uploaded workflow artifacts above.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.outputs.outputs.debug_apk }}
            ${{ steps.outputs.outputs.release_apk }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
